[package]
name = "xkm_native"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"
authors = ["Xms-Team"]
description = "Native library for Xtra Kernel Manager"

[lib]
name = "xkm_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "device_runner"
path = "tests/device_runner/main.rs"
test = false

[dependencies]
jni = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
anyhow = "1.0"
tracing = "0.1"
libc = "0.2"
rustix = { version = "1.1.6", default-features = false, features = ["fs"] }
once_cell = "1.21"
parking_lot = "0.13"
android-properties = "0.2"
kala-ebpf = "0.2.0"
rsbinder = { version = "0.13.0", features = ["android_14_plus", "macros"] }

procfs = { version = "0.18", optional = true, default-features = false, features = [
    "serde1",
] }
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"
tempfile = "3.27"
loom = "0.7"

[[bench]]
name = "telemetry_bench"
harness = false

[[bench]]
name = "fps_bench"
harness = false

[features]
default = []
advanced = ["procfs", "walkdir"]

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
panic = "abort"
codegen-units = 1
overflow-checks = false

[profile.release.package."*"]
opt-level = "z"
strip = "symbols"

[profile.bench]
opt-level = 3
